name: Parking Manager CI/CD

on: push: branches: - master workflow_dispatch:

permissions: contents: read

concurrency: group: parking-manager-production cancel-in-progress: false

jobs: deploy: name: Deploy to AWS EC2 runs-on: ubuntu-latest

steps:
  # 1. Checkout repository
  - name: Checkout code
    uses: actions/checkout@v4

  # 2. Configure SSH authentication
  - name: Configure SSH
    env:
      EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
    run: |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh

      printf '%s\n' "$EC2_KEY" > ~/.ssh/key.pem
      chmod 600 ~/.ssh/key.pem

      printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
      chmod 600 ~/.ssh/known_hosts

  # 3. Test EC2 SSH connection
  - name: Test EC2 connection
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    run: |
      ssh -i ~/.ssh/key.pem \
        -o StrictHostKeyChecking=yes \
        -o BatchMode=yes \
        ubuntu@$EC2_HOST \
        "echo 'EC2 SSH connection successful'"

  # 4. Pull latest code and rebuild application
  - name: Deploy application
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    run: |
      ssh -i ~/.ssh/key.pem \
        -o StrictHostKeyChecking=yes \
        -o BatchMode=yes \
        ubuntu@$EC2_HOST \
        "cd /home/ubuntu/parking-manager && \
         git pull --ff-only origin master && \
         docker compose up -d --build"

  # 5. Verify Docker containers
  - name: Check Docker containers
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    run: |
      ssh -i ~/.ssh/key.pem \
        -o StrictHostKeyChecking=yes \
        -o BatchMode=yes \
        ubuntu@$EC2_HOST \
        "cd /home/ubuntu/parking-manager && docker compose ps"

  # 6. Verify application HTTP response
  - name: Verify application
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    run: |
      ssh -i ~/.ssh/key.pem \
        -o StrictHostKeyChecking=yes \
        -o BatchMode=yes \
        ubuntu@$EC2_HOST \
        "curl -f --retry 5 --retry-delay 5 --retry-connrefused http://localhost/"
